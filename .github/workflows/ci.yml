name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.34.6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm eval:malicious
      - run: pnpm build:cli
      - name: Smoke-test the bundled CLI and its npm tarball
        run: |
          node packages/cli/dist/cli.js test/fixtures/benign
          set +e; node packages/cli/dist/cli.js test/fixtures/malicious; code=$?; set -e
          test "$code" = "1"
          cd packages/cli && npm pack --dry-run
      - run: pnpm build

  # Dogfood the composite action from this checkout. Benign fixtures must pass;
  # the malicious corpus must make the action fail.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan benign fixtures
        uses: ./
        with:
          path: test/fixtures/benign
      - name: Scan malicious fixtures (expected to fail)
        id: malicious
        continue-on-error: true
        uses: ./
        with:
          path: test/fixtures/malicious
          sarif-file: malicious.sarif
      - name: Assert the malicious scan failed with exit code 1
        env:
          OUTCOME: ${{ steps.malicious.outcome }}
          EXIT_CODE: ${{ steps.malicious.outputs.exit-code }}
        run: |
          test "$OUTCOME" = "failure"
          test "$EXIT_CODE" = "1"
          node -e "const s=JSON.parse(require('fs').readFileSync('malicious.sarif','utf8')); if (s.version!=='2.1.0'||!s.runs[0].results.length) process.exit(1)"
